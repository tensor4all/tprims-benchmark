timing_policy:
  version: 1
  minimum_untimed_priming_ms: 500
  statistic: best
  repetitions: 5
  notes: 'priming is time-based, not a call count: after an idle gate this host reports
    up to 25% low for the first 1-2 s of sustained work. The value is the one the
    harness reported, not the one this script asked for'
guards:
  idle_window_seconds: 3
  max_busy_percent: 5
  attempts: 3
  logs:
